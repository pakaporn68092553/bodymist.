<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ — Body Scent</title>
  <meta name="description" content="กรอกข้อมูลเพื่อยืนยันคำสั่งซื้อน้ำหอมฉีดตัวและโรลออนจาก Body Scent">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section section--page">
      <div class="container">

        <div class="page-head">
          <h1 class="rule">สั่งซื้อ</h1>
          <p class="muted">ตรวจสอบรายการสินค้าและจำนวนเงิน แล้วกรอกข้อมูลเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <form id="orderForm" class="order-form">

          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="2" required></textarea>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="numeric" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <div>
            <button type="submit" class="btn btn--solid">ยืนยันสั่งซื้อ</button>
          </div>

          <p class="muted">ยังไม่ได้เลือกสินค้า? <a href="product.html">ดูสินค้าทั้งหมด</a></p>

        </form>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>Body Scent — กลิ่นที่ใช่ สำหรับความรู้สึกที่เป็นคุณ</span>
      <span>© 2026 Body Scent</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
